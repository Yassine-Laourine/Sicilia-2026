 Cone",icon:"🐟",desc:"Fritto misto served in a paper cone — the Catania street food experience. Expect squid, shrimp, small fish. Eat standing. Queue is normal.",where:"Scirocco Sicilian Fish Lab, La Pescheria, Catania"},{name:"Horse Meat",icon:"🥩",desc:"A Catanian speciality, especially around Via Plebiscito and Castello Ursino. Grilled on outdoor barbecues on the street. Order a horse sandwich and eat walking.",where:"Via Plebiscito street stalls · La Terrazza del Barone"},{name:"Pasta alla Norma",icon:"🍝",desc:"Catania's signature dish. Rigatoni or spaghetti with tomato sauce, fried aubergine and salty ricotta. Do not skip this.",where:"Trattoria del Cavaliere · Trattoria da Nino (Taormina)"},{name:"Caseificio Borderi Panino",icon:"🧀",desc:"Legendary market sandwich in Ortigia. Fresh mozzarella, prosciutto, pesto, sun-dried tomatoes. So large you could split one. Sell out by 1pm.",where:"Caseificio Borderi, Ortigia Market, Syracuse"},{name:"Cannolo",icon:"🍮",desc:"Crispy fried pastry shell filled with sweet ricotta and candied fruit. Always order it freshly filled — never pre-filled. Pasticceria Savia is a benchmark.",where:"Pasticceria Savia · Pasticceria Artale (Ortigia)"}],v=["La Pescheria (Catania) opens from ~7am and winds down by 2pm — go in the morning for the full chaos.","Sea urchins (ricci di mare) are in season in summer — try one fresh at a stall for ~1–2€.","Ortigia Market (Syracuse) is smaller and calmer than Pescheria — better for buying cheese, olives and charcuterie to eat at the sea walls.",'Always bargain politely at market stalls — asking "è fresco?" (is it fresh?) builds rapport.',"Blood oranges (arance rosse di Sicilia) are a protected designation of origin product. Buy a bag and eat them cold."];function b(){return(0,i.jsxs)("div",{className:"section-view",children:[(0,i.jsxs)("div",{className:"section-header",children:[(0,i.jsx)("h2",{children:"Food Guide"}),(0,i.jsx)("p",{children:"What to eat & where to find it"})]}),(0,i.jsx)("div",{cla rges, policy disputes).","Confirm CDW (collision damage waiver) and theft cover is included before signing.","Fill the tank before returning the car — do not rely on airport fuel stations (overpriced).","Sicilian driving is assertive. Stay in lane, drive defensively, watch for scooters.","GPS or offline maps (Maps.me) are highly recommended — mountain roads to Etna have poor signage."]},{title:"Parking at Etna",icon:"🌋",color:"#8E44AD",items:["Rifugio Sapienza has paid parking: ~5€ for half a day.","Enter your licence plate number at the parking machine and display the ticket.","Arrive by 9:30am in July — the car park fills up by late morning."]},{title:"Alcantara – Municipal Entrance",icon:"💧",color:"#27AE60",items:["There are two entrances to the gorges. The private one charges ~6€ extra for a lift — unnecessary.","Use the Municipal (Comune) entrance on the left — free access, walk down the path to the gorge.","Water temperature: ~15°C even in July. Water shoes are essential — volcanic riverbed is sharp."]},{title:"Emergency Contacts",icon:"🆘",color:"#C0392B",items:["Emergency: 112 (EU standard)","Police (Carabinieri): 112","Sicily in Home: +39 339 581 0186","easyJet customer service: accessible via app","European Health Insurance Card (EHIC): make sure both travellers carry one."]}];function w(){return(0,i.jsxs)("div",{className:"section-view",children:[(0,i.jsxs)("div",{className:"section-header",children:[(0,i.jsx)("h2",{children:"Logistics & Warnings"}),(0,i.jsx)("p",{children:"ZTL zones, transport, car rental & more"})]}),(0,i.jsx)("div",{className:"logistics-list",children:k.map((e,t)=>(0,i.jsxs)("div",{className:"logistics-card",children:[(0,i.jsxs)("div",{className:"logistics-card-header",style:{borderLeftColor:e.color},children:[(0,i.jsx)("span",{className:"logistics-icon",children:e.icon}),(0,i.jsx)("h3",{className:"logistics-title",children:e.title})]}),(0,i.jsx)("ul",{className:"logistics-items",children:e.items.map((t,n)=>(0,i.jsxs)("li",{className:"l h swordfish, tuna, squid and sea urchins. Best experienced before 2pm while it's still lively.",tag:"culture",link:{label:"La Pescheria on Maps",url:"https://maps.app.goo.gl/FsX9V4Y8RBXjnvRe9"},tip:"The market sits in a sunken baroque piazza — the atmosphere is theatrical. Go early afternoon before stalls pack up."},{time:"Afternoon",title:"Piazza del Duomo & Fontana dell'Elefante",description:"Catania's iconic baroque square with the lava-stone elephant fountain, symbol of the city. The Cathedral of Sant'Agata faces the square — worth a quick look inside.",tag:"culture"},{time:"Dinner",title:"Scirocco Sicilian Fish Lab",description:"Legendary fried seafood cones served in paper, right on the edge of La Pescheria. Order the mixed cone (fritto misto) and eat standing — this is Catania street food at its best. Expect a short queue.",tag:"food",link:{label:"Scirocco on Maps",url:"https://maps.app.goo.gl/L8Bv6jnB6LuB5Xqz9"},tip:"They call your name out when your order is ready. It's loud and chaotic — exactly right."}]},{day:2,date:"July 5",title:"Etna & Alcantara",subtitle:"Quad Tour & Gorge Swim",theme:"#E67E22",activities:[{time:"Morning",title:"Pick Up Rental Car – CTA Airport",description:"Return to the airport by Alibus to collect the rental car. Compare and book via Skyscanner or Discover Cars — book at least 4 weeks in advance for best rates. Driving licence required. Avoid Budget and B-Rent based on very poor CTA reviews.",tag:"transport",link:{label:"Compare on Skyscanner",url:"https://www.skyscanner.com/car-rental-from/cta/car-rental-from-catania-fontanarossa-airport.html"},warning:"ZTL zones in Catania centre are strictly enforced with cameras — fines arrive weeks later. Do not drive into the historic centre. Park at Parcheggio Borsellino near the Fish Market if needed."},{time:"~9:30am",title:"Drive to Rifugio Sapienza – Mt. Etna",description:"Drive ~45 min from Catania up the southern slope of Etna to Rifugio Sapienza at 1,910m altitude. Paid parking ~5€ (enter your licence plate at the machine). Dress in layers — it's significantly colder than the coast.",tag:"transport",tip:"Views of the Ionian Sea from the car park are already spectacular on a clear day."},{time:"10:00am",title:"2-Hour Quad Tour – Rifugio Sapienza",description:"Guided quad tour through ancient lava fields, old craters and a lava cave. Two people share one quad. No prior experience needed — quads are automatic. Departs at 10:00, 12:00, 14:00 or 16:00. Cost: €110 per quad (2 people). Pay on the day — no upfront payment required. Guide speaks Italian and English.",tag:"activity",link:{label:"Book – Piano Provenzana",url:"https://pianoprovenzana.com/excursion/etna-sud-quad-tour-2-hours/"},tip:"Bring closed shoes, a jacket and sunglasses. Book by WhatsApp or the website to guarantee your time slot."},{time:"Afternoon",title:"Alcantara Gorges – Municipal Entrance",description:"Drive ~40 min from Etna to the Gole Alcantara. Enter via the free Municipal access (NOT the private tourist entrance which charges an extra lift fee). Walk down the path to swim in the crystal-clear volcanic gorge. Water shoes essential — the riverbed is volcanic rock.",tag:"swim",link:{label:"Alcantara Gorges",url:"https://maps.app.goo.gl/UKxCVKkm2J7VY4tU7"},warning:"The water is cold even in July (~15°C). The private entrance next door charges ~6€ for a lift — it's unnecessary. Use the municipal access on the left."},{time:"Evening",title:"Dinner Options – Back in Catania",description:"Return to Catania (~1h drive). Three options:\n\n• Osteria Antica Marina (La Pescheria) – top seafood, spaghetti al riccio di mare, lively market setting. Book ahead.\n• Trattoria del Cavaliere (Via Paternò 11) – huge portions, cheap, great pasta alla Norma. Catanese institution.\n• Due Pistacchi (Via S. Tomaselli 9) – creative pistachio-forward dishes, open 7 days.",tag:"food",tip:"Osteria Antica Marina is closed Wednesdays. Call ahead for a reservation."}]},{day:3,date:"July 6",title:"Siracusa & Ortigia",subtitle:"Granita, Market & Ionian Sea",theme:"#2980B9",activities:[{time:"Morning",title:"Granita Breakfast in Catania",description:"Before heading out, start with the quintessential Sicilian breakfast: granita con brioche col tuppo. Four options near the guesthouse:\n\n• Pasticceria Savia (Via Etnea) – institution since 1897, legendary pistachio granita. Pay at cashier first.\n• Bar Spinella (Via Etnea) – right next to Savia, great pistachio cornetto, arguably friendlier service.\n• Bar Mazzini – warm local atmosphere, excellent granita, staff treats you like family.\n• Ma Maison – hidden side-street gem, best toasted almond granita in Catania per locals.",tag:"food",link:{label:"Pasticceria Savia",url:"https://maps.app.goo.gl/bXm5jE7o8YFj2iFu6"},tip:"Order: almond granita + espresso. Pour the espresso bit by bit over the granita as you eat it. Life-changing."},{time:"~9:30am",title:"Drive to Syracuse (~1h)",description:"Head south on the A18/E45 motorway from Catania to Syracuse. Park on the mainland near the bridge to Ortigia — blue-line street parking available.",tag:"transport",tip:"Park near the Ponte Umbertino bridge. Do not drive onto Ortigia island itself — streets are extremely narrow and ZTL zones apply."},{time:"Morning",title:"Temple of Apollo – Ortigia",description:"The first thing you see entering Ortigia — the ruins of the 6th-century BC Temple of Apollo, one of the oldest Greek temples in Sicily. Free to view from outside. A remarkable fragment of the ancient world embedded in the baroque streetscape.",tag:"culture",link:{label:"Temple of Apollo",url:"https://maps.app.goo.gl/bZM3ciqE4QzHEDwSA"}},{time:"Morning",title:"Explore Ortigia on Foot",description:"Wander the baroque alleys of Ortigia: Piazza del Duomo (Cathedral built inside a Greek temple — extraordinary), Fonte Aretusa (freshwater spring by the sea, surrounded by papyrus), and the Jewish Quarter (Giudecca) with its ancient mikveh.",tag:"culture",tip:"Ortigia is only ~1km end to end. Everything is walkable. Get happily lost."},{time:"Lunch",title:"Caseificio Borderi – Ortigia Market",description:"The legendary sandwich spot right in the Ortigia market. Fresh mozzarella, smoked prosciutto, homemade pesto, sun-dried tomatoes — all stuffed into a panino so large you could split one between two. Get here before 1pm before they sell out.",tag:"food",link:{label:"Caseificio Borderi",url:"https://maps.app.goo.gl/tnhDQfxYq3GVVMxJ8"},tip:"Buy extra cheese and olives from the market stalls to snack on at the sea walls later."},{time:"Afternoon",title:"Swim – Cala Rossa & Solarium di Forte Vigliena",description:"Ortigia's best swimming spots on the Lungomare di Levante. Cala Rossa is a small cove accessible via a staircase with crystal-clear Ionian water and views of the ancient city walls. The free Solarium di Forte Vigliena is a wooden sun deck built onto the rocks with showers — locals' favourite. Water shoes recommended.",tag:"swim",tip:"The water quality here is genuinely excellent — open Ionian Sea, no harbour. July water temp ~25°C."},{time:"Evening",title:"Dinner Options",description:"In Ortigia if staying late:\n• Ranieri – top seafood, extensive Sicilian wine list, tables on a historic piazza. Book ahead.\n• Oz-eta Ortigia – quality local ingredients, great Sicilian wines by the glass, friendly staff.\n• Ristorante Jobi – reliable, warm welcome, excellent penne alla Norma.\n\nOr drive back to Catania (~1h) and use Day 2 restaurant options.",tag:"food"}]},{day:4,date:"July 7",title:"Taormina & Isola Bella",subtitle:"Snorkeling, Corso Umberto & Greek Theatre",theme:"#27AE60",activities:[{time:"Morning",title:"Drive to Taormina (~1h)",description:"Head north on the A18 motorway. Park below Taormina in Mazzarò or Giardini Naxos — the town centre is pedestrian-only and perched on a cliff. Cable car or funicular connects the port area to the old town.",tag:"transport",warning:"Taormina's old town is entirely pedestrian. Do not attempt to drive in. Parking is available in Lumbi lot (above town) or at Mazzarò beach below."},{time:"~9:30am",title:"Snorkeling Tour – Isola Bella Marine Park",description:"Depart from Giardini Naxos harbour for a guided snorkeling tour in the Isola Bella nature reserve. Two snorkel stops: Isola Bella Marine Park and Baia delle Sirene. PADI-certified guides, all equipment included (mask, fins, wetsuit). ~3 hours. Arrive 15-30 min early.",tag:"swim",link:{label:"Book – Sicily Adventure (from €35)",url:"https://www.sicily-adventure.it/en/activity/snorkeling-taormina.html"},tip:"Three operators to compare: Sicily Adventure (budget), Sicily Day Trips (mid), Sea Spirit via Viator (premium 4h with food & prosecco). Book at least 5-6 weeks ahead — tours fill fast in July."},{time:"Afternoon",title:"Corso Umberto – Taormina Old Town",description:"The main pedestrian street of Taormina, lined with baroque palaces, artisan shops, aperitivo bars and restaurants. Walk the full length from Porta Messina to Porta Catania. Stop at Piazza IX Aprile for one of the finest views in Sicily: the Ionian Sea, the bay of Naxos, and Etna behind you. Bam Bar on this square is legendary for granita.",tag:"culture",link:{label:"Corso Umberto",url:"https://maps.app.goo.gl/b5JcBK9VBBNwf4bZ8"},tip:"The side alleys off Corso Umberto have better prices and fewer tourists than the main drag."},{time:"Sunset",title:"Ancient Greek Theatre of Taormina",description:"One of the most spectacular ancient theatres in the world — built by the Greeks in the 3rd century BC, later expanded by the Romans. The view from the stage: Etna to the left, the Ionian Sea ahead. Visit at sunset for the full effect. Book tickets in advance.",tag:"culture",link:{label:"Teatro Antico – Tickets",url:"https://www.coopculture.it/en/poi/teatro-antico-di-taormina/"},tip:"Entry ~€10. The light at golden hour through the arches is extraordinary. Go 30 min before sunset."},{time:"Dinner",title:"Dinner in Taormina",description:"Three options before driving back:\n\n• Trattoria da Nino – Catanese family institution for 50+ years, sea-view terrace, honest Sicilian cooking, best value. Book ahead.\n• A' Zammàra – garden with orange trees, lanterns, candlelit magic. Linguine with shrimps and pistachios.\n• Osteria Rosso Divino – outstanding fresh fish, owner describes every dish personally, unhurried atmosphere.",tag:"food",tip:"After dinner, drive back to Catania (~1h) and drop the rental car at CTA Airport tonight or first thing tomorrow. Car rental period ends Day 4."},{time:"Evening",title:"Return Rental Car – CTA Airport",description:"Drive back from Taormina to Catania (~1h on the A18). Return the rental car at CTA Airport. Then Alibus or taxi back to the guesthouse in the city centre.",tag:"transport",warning:"Fill up the tank before returning the car — fuel near airports is overpriced and some contracts require a full tank on return."}]},{day:5,date:"July 8–9",title:"Ultima Sera & Partenza",subtitle:"Final Evening & 8:50am Departure",theme:"#8E44AD",activities:[{time:"July 8 – Evening",title:"Final Evening in Catania",description:"Last night in the city. Walk Via Etnea, grab a gelato or late granita, have a final dinner near the Fish Market. The evening atmosphere in the baroque centro storico is hard to beat.",tag:"culture",tip:"Revisit Scirocco or try Spaghetti & Co. (fresh pasta to die for, recommended by Sicily in Home guests) for your last meal."},{time:"July 9 – 6:30am",title:"Wake Up & Check Out",description:"Early start. Pack the night before. Check out of Sicily in Home and walk to the Alibus stop — it's 2 minutes from the guesthouse on foot.",tag:"transport",warning:"Flight departs 8:50am. Leave guesthouse no later than 7:00am. The Alibus takes ~20 min to the airport. Allow time for check-in and security."},{time:"~7:05am",title:"Alibus to CTA Airport",description:"Catch the Alibus from Via Etnea / Stazione Centrale to Catania Fontanarossa Airport. ~20 min ride, ~4 CHF. Runs every 20 min from 5am.",tag:"transport",link:{label:"Alibus timetable",url:"https://www.amt.ct.it/alibus"}},{time:"8:50am",title:"Fly Catania → Geneva",description:"easyJet flight CTA → GVA. Arrive Geneva. Fine. Until next time, Sicilia.",tag:"transport",link:{label:"easyJet booking",url:"https://www.easyjet.com/en/cheap-flights/catania/geneva"}}]}];(0,u.createRoot)(document.getElementById("root")).render((0,i.jsx)(o.StrictMode,{children:(0,i.jsx)(function(){let[e,t]=(0,o.useState)("days"),[n,r]=(0,o.useState)(0);return(0,i.jsxs)("div",{className:"app-root",children:[(0,i.jsx)(s,{}),(0,i.jsx)(f,{activeTab:e,setActiveTab:t}),(0,i.jsxs)("main",{className:"main-content",children:["days"===e&&(0,i.jsx)(p,{days:E,activeDay:n,setActiveDay:r}),"budget"===e&&(0,i.jsx)(g,{}),"food"===e&&(0,i.jsx)(b,{}),"logistics"===e&&(0,i.jsx)(w,{}),"packing"===e&&(0,i.jsx)(x,{})]})]})},{})}));</script>
